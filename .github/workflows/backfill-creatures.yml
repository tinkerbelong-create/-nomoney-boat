# =====================================================================
# 過去の的中をさかのぼって、水槽の生き物を配る
#
# 手動実行のみ。水槽を入れた直後に1回だけ押す。
# 何度押しても、すでに配ったレースは飛ばすので安全。
#
# 【押す前に必ず】
#   Supabase の SQL Editor で 0018 / 0019 / seed_creatures.sql を
#   実行し終えていること。テーブルが無いと何も起きない。
# =====================================================================

name: backfill-creatures

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Asia/Tokyo

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: backfill
        run: npm run ingest -- backfill-creatures
