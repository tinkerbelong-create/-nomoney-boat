# =====================================================================
# 1日1回まわす処理
#   - 当日と翌日の開催スケジュール・出走表の取り込み
#   - 取り残した古いレースの回収
#   - 月初のポイント付与
# =====================================================================

name: daily

on:
  schedule:
    # JST 06:00 と 12:00（cron は UTC なので -9時間）
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INGEST_USER_AGENT: ${{ vars.INGEST_USER_AGENT }}
      TZ: Asia/Tokyo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json をリポジトリに置いていないので npm ci は使えない。
      # npm install で毎回入れ直す（1分ほど）。
      - run: npm install --no-audit --no-fund

      # 当日と翌日のレース・締切時刻
      - name: schedule
        run: npm run ingest -- schedule

      # 出走表
      - name: entrants
        run: npm run ingest -- entrants

      # 今日のお題レースを決める
      - name: feature
        run: npm run ingest -- feature

      # 取り残しの回収
      - name: settle-old
        run: npm run ingest -- settle-old

      # 月初なら前月の月間タイトルを発行する
      - name: titles
        run: |
          if [ "$(date +%d)" = "01" ]; then
            npm run ingest -- titles
          else
            echo "月初ではないのでスキップ"
          fi

      # 毎週木曜日にポイントを配る（木曜以外の日は何も起きない）
      - name: weekly
        run: npm run ingest -- weekly
